<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }
    a { color: #F5F5F4; } a:hover { color: #C7C7CC; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1350px; box-sizing: border-box; background: #0A0A0B; overflow: hidden; padding: 84px 80px; display: flex; flex-direction: column;">

  <div style="position: absolute; top: -200px; left: -160px; width: 640px; height: 640px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 70%);"></div>

  <!-- header -->
  <div style="position: relative; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-weight: 700; font-size: 22px; letter-spacing: 0.18em; color: #8E8E93;">COBROS Y MOROSIDAD</div>
    <div style="font-weight: 800; font-size: 24px; letter-spacing: -0.03em; color: #F5F5F4;">Cuotafit</div>
  </div>

  <div style="position: relative; margin-top: 40px;">
    <h2 style="margin: 0; font-weight: 800; font-size: 76px; line-height: 1.03; letter-spacing: -0.035em; color: #F5F5F4;">Nunca más pierdas<br>una <span style="border-bottom: 5px solid rgba(255,255,255,0.30); padding-bottom: 4px;">cuota</span></h2>
  </div>

  <!-- dashboard mock -->
  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px;">

    <!-- stat row -->
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;">
      <div style="padding: 30px 28px; border-radius: 24px; background: #141416; border: 1px solid rgba(255,255,255,0.14);">
        <div style="font-weight: 800; font-size: 62px; color: #F5F5F4; line-height: 1;">5</div>
        <div style="font-weight: 600; font-size: 24px; color: #9A9AA0; margin-top: 10px;">Por vencer</div>
      </div>
      <div style="padding: 30px 28px; border-radius: 24px; background: #141416; border: 1px solid rgba(255,255,255,0.14);">
        <div style="font-weight: 800; font-size: 62px; color: #F5F5F4; line-height: 1;">3</div>
        <div style="font-weight: 600; font-size: 24px; color: #9A9AA0; margin-top: 10px;">Vencidos</div>
      </div>
      <div style="padding: 30px 28px; border-radius: 24px; background: #141416; border: 1px solid rgba(255,255,255,0.14);">
        <div style="font-weight: 800; font-size: 62px; color: #F5F5F4; line-height: 1;">4</div>
        <div style="font-weight: 600; font-size: 24px; color: #9A9AA0; margin-top: 10px;">Pocos pases</div>
      </div>
    </div>

    <!-- income (inverted, hero) -->
    <div style="padding: 34px 36px; border-radius: 26px; background: #F5F5F4; box-shadow: 0 24px 60px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div style="font-weight: 700; font-size: 26px; color: #55555A;">Ingresos del mes</div>
        <div style="font-weight: 800; font-size: 64px; color: #0A0A0B; letter-spacing: -0.02em; line-height: 1.05; margin-top: 6px;">$ 284.500</div>
      </div>
      <svg width="120" height="80" viewBox="0 0 120 80" fill="none" style="flex: none;">
        <rect x="6" y="52" width="16" height="22" rx="4" fill="rgba(10,10,11,0.25)"></rect>
        <rect x="32" y="40" width="16" height="34" rx="4" fill="rgba(10,10,11,0.4)"></rect>
        <rect x="58" y="28" width="16" height="46" rx="4" fill="rgba(10,10,11,0.6)"></rect>
        <rect x="84" y="14" width="16" height="60" rx="4" fill="#0A0A0B"></rect>
      </svg>
    </div>

    <!-- payment row -->
    <div style="padding: 26px 32px; border-radius: 24px; background: #141416; border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 20px;">
      <div style="flex: none; width: 56px; height: 56px; border-radius: 16px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F5F5F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
      </div>
      <div style="flex-grow: 1; font-weight: 700; font-size: 30px; color: #F5F5F4;">Pago registrado · Carlos Ruiz</div>
      <div style="font-weight: 700; font-size: 30px; color: #F5F5F4;">$ 12.000</div>
    </div>

  </div>

  <div style="position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 30px;">
    <p style="margin: 0; font-weight: 500; font-size: 30px; line-height: 1.35; color: #9A9AA0; max-width: 760px;">Sabes al instante quién está <span style="color:#F5F5F4; font-weight:700;">por vencer o vencido</span>, y registras pagos en segundos.</p>
    <div style="flex: none; font-weight: 700; font-size: 24px; color: #5C5C61;">04 / 06</div>
  </div>

</div>

</x-dc>
</body>
</html>
