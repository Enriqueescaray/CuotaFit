<!doctype html>

<x-dc>

  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }

<div style="position: relative; width: 1080px; height: 1350px; box-sizing: border-box; background: #0A0A0B; overflow: hidden; padding: 84px 80px; display: flex; flex-direction: column;">

  <!-- subtle depth -->
  <div style="position: absolute; top: -240px; right: -180px; width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0) 70%);"></div>
  <div style="position: absolute; bottom: -300px; left: -220px; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0) 70%);"></div>

  <!-- brand -->
  <div style="position: relative; display: flex; align-items: center; gap: 14px;">
    <div style="position: relative; width: 56px; height: 56px; border-radius: 15px; background: #F5F5F4; display: flex; align-items: center; justify-content: center;">
      <svg width="40" height="40" viewBox="0 0 120 120" style="position: absolute;"><circle cx="60" cy="60" r="46" fill="none" stroke="#0A0A0B" stroke-width="13" stroke-linecap="round" stroke-dasharray="214 75" transform="rotate(40 60 60)"></circle></svg>
      <span style="position: relative; font-weight: 800; font-size: 22px; color: #0A0A0B; line-height: 1;">F</span>
    </div>
    <div style="font-weight: 800; font-size: 30px; letter-spacing: -0.03em; line-height: 1; color: #F5F5F4;">Cuotafit</div>
  </div>

  <!-- hero -->
  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 34px;">
    <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14);">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #F5F5F4; display: block;"></span>
      <span style="font-weight: 700; font-size: 20px; letter-spacing: 0.16em; color: #C7C7CC;">SOFTWARE PARA GIMNASIOS</span>
    </div>

    <h1 style="margin: 0; font-weight: 800; font-size: 92px; line-height: 1.03; letter-spacing: -0.035em; color: #F5F5F4; text-wrap: balance;">Deja de perseguir<br>las cuotas por<br><span style="color: #6E6E73; text-decoration: line-through; text-decoration-thickness: 6px;">WhatsApp</span></h1>

    <p style="margin: 0; font-weight: 500; font-size: 37px; line-height: 1.4; color: #9A9AA0; max-width: 820px;">Socios, cobros y control de acceso de tu gimnasio en un solo panel. Simple, en español y multi-gimnasio.</p>
  </div>

  <!-- footer -->
  <div style="position: relative; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 26px; color: #F5F5F4;">
      Desliza para ver cómo
