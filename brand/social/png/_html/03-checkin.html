<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }
    a { color: #F5F5F4; } a:hover { color: #C7C7CC; }
  </style>
<style>
  html, body { margin: 0; padding: 0; width: 1080px; height: 1350px; overflow: hidden; background: #0A0A0B; }
</style>
</head>
<body>
<div style="position: relative; width: 1080px; height: 1350px; box-sizing: border-box; background: #0A0A0B; overflow: hidden; padding: 84px 80px; display: flex; flex-direction: column;">

  <div style="position: absolute; top: -200px; right: -160px; width: 660px; height: 660px; border-radius: 50%; background: radial-gradient(circle, rgba(34,197,94,0.12) 0%, rgba(34,197,94,0) 70%);"></div>

  <!-- header -->
  <div style="position: relative; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-weight: 700; font-size: 22px; letter-spacing: 0.18em; color: #8E8E93;">CONTROL DE ACCESO</div>
    <div style="font-weight: 800; font-size: 24px; letter-spacing: -0.03em; color: #F5F5F4;">Cuotafit</div>
  </div>

  <div style="position: relative; margin-top: 40px;">
    <h2 style="margin: 0; font-weight: 800; font-size: 76px; line-height: 1.03; letter-spacing: -0.035em; color: #F5F5F4;">El socio entra<br>con su <span style="border-bottom: 5px solid rgba(255,255,255,0.30); padding-bottom: 4px;">PIN</span></h2>
  </div>

  <!-- kiosk mock -->
  <div style="position: relative; flex-grow: 1; display: flex; align-items: center; justify-content: center;">
    <div style="width: 720px; border-radius: 34px; background: #141416; border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 40px 90px rgba(0,0,0,0.6); overflow: hidden;">

      <!-- green success banner -->
      <div style="background: linear-gradient(180deg, rgba(34,197,94,0.18) 0%, rgba(34,197,94,0.04) 100%); padding: 46px 48px 40px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.07);">
        <div style="width: 108px; height: 108px; margin: 0 auto 22px; border-radius: 50%; background: #22C55E; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 34px rgba(34,197,94,0.4);">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
        </div>
        <div style="font-weight: 800; font-size: 46px; color: #4ADE80; letter-spacing: -0.02em;">Acceso permitido</div>
      </div>

      <!-- member row -->
      <div style="padding: 36px 48px; display: flex; align-items: center; gap: 22px;">
        <div style="flex: none; width: 76px; height: 76px; border-radius: 50%; background: #26262A; border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 30px; color: #F5F5F4;">MG</div>
        <div style="flex-grow: 1;">
          <div style="font-weight: 800; font-size: 34px; color: #F5F5F4;">María González</div>
          <div style="font-weight: 600; font-size: 25px; color: #8E8E93; margin-top: 2px;">Plan por pases</div>
        </div>
        <div style="text-align: right;">
          <div style="font-weight: 800; font-size: 40px; color: #4ADE80; line-height: 1;">8</div>
          <div style="font-weight: 600; font-size: 20px; color: #8E8E93; margin-top: 4px;">pases restantes</div>
        </div>
      </div>

      <!-- pin dots -->
      <div style="padding: 0 48px 40px; display: flex; align-items: center; justify-content: center; gap: 18px;">
        <span style="width: 22px; height: 22px; border-radius: 50%; background: #F5F5F4;"></span>
        <span style="width: 22px; height: 22px; border-radius: 50%; background: #F5F5F4;"></span>
        <span style="width: 22px; height: 22px; border-radius: 50%; background: #F5F5F4;"></span>
        <span style="width: 22px; height: 22px; border-radius: 50%; background: #F5F5F4;"></span>
        <span style="width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,0.16);"></span>
      </div>
    </div>
  </div>

  <div style="position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 30px;">
    <p style="margin: 0; font-weight: 500; font-size: 30px; line-height: 1.35; color: #9A9AA0; max-width: 760px;">Verde entra, rojo no. Cada ingreso <span style="color:#F5F5F4; font-weight:700;">descuenta un pase</span> y queda registrado como asistencia.</p>
    <div style="flex: none; font-weight: 700; font-size: 24px; color: #5C5C61;">03 / 06</div>
  </div>

</div>
</body>
</html>
