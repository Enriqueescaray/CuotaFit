<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }
    a { color: #F5F5F4; } a:hover { color: #C7C7CC; }
  </style>
<style>
  html, body { margin: 0; padding: 0; width: 1080px; height: 1350px; overflow: hidden; background: #0A0A0B; }
</style>
</head>
<body>
<div style="position: relative; width: 1080px; height: 1350px; box-sizing: border-box; background: #0A0A0B; overflow: hidden; padding: 84px 80px; display: flex; flex-direction: column;">

  <div style="position: absolute; top: -220px; left: -160px; width: 640px; height: 640px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.045) 0%, rgba(255,255,255,0) 70%);"></div>

  <!-- header -->
  <div style="position: relative; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-weight: 700; font-size: 22px; letter-spacing: 0.18em; color: #8E8E93;">EL PROBLEMA</div>
    <div style="font-weight: 800; font-size: 24px; letter-spacing: -0.03em; color: #F5F5F4;">Cuotafit</div>
  </div>

  <div style="position: relative; margin-top: 46px;">
    <h2 style="margin: 0; font-weight: 800; font-size: 74px; line-height: 1.05; letter-spacing: -0.035em; color: #F5F5F4; text-wrap: balance;">Manejar el gimnasio<br>a mano es un caos</h2>
  </div>

  <!-- pains -->
  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 26px;">

    <div style="display: flex; align-items: center; gap: 28px; padding: 34px 36px; border-radius: 24px; background: #141416; border: 1px solid rgba(255,255,255,0.08);">
      <div style="flex: none; width: 74px; height: 74px; border-radius: 20px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center;">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#F5F5F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      </div>
      <div>
        <div style="font-weight: 800; font-size: 36px; color: #F5F5F4; letter-spacing: -0.02em;">Cuadernos y planillas</div>
        <div style="font-weight: 500; font-size: 27px; color: #8E8E93; margin-top: 4px;">que se pierden o quedan sin actualizar</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 28px; padding: 34px 36px; border-radius: 24px; background: #141416; border: 1px solid rgba(255,255,255,0.08);">
      <div style="flex: none; width: 74px; height: 74px; border-radius: 20px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center;">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#F5F5F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path></svg>
      </div>
      <div>
        <div style="font-weight: 800; font-size: 36px; color: #F5F5F4; letter-spacing: -0.02em;">No sabes quién debe</div>
        <div style="font-weight: 500; font-size: 27px; color: #8E8E93; margin-top: 4px;">la cuota vencida se te escapa cada mes</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 28px; padding: 34px 36px; border-radius: 24px; background: #141416; border: 1px solid rgba(255,255,255,0.08);">
      <div style="flex: none; width: 74px; height: 74px; border-radius: 20px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center;">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#F5F5F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
      </div>
      <div>
        <div style="font-weight: 800; font-size: 36px; color: #F5F5F4; letter-spacing: -0.02em;">Cualquiera entra</div>
        <div style="font-weight: 500; font-size: 27px; color: #8E8E93; margin-top: 4px;">sin control real de quién pagó y quién no</div>
      </div>
    </div>

  </div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-weight: 700; font-size: 27px; color: #C7C7CC;">Hay una forma más simple <span style="color:#F5F5F4;">→</span></div>
    <div style="font-weight: 700; font-size: 24px; color: #5C5C61;">02 / 06</div>
  </div>

</div>

</html>
