<!doctype html>

  <style>

<style>

<div style="position: relative; width: 1080px; height: 1350px; box-sizing: border-box; background: #0A0A0B; overflow: hidden; padding: 84px 80px; display: flex; flex-direction: column; align-items: center; text-align: center;">
