<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 520px; height: 440px; background: #F5F6FA; box-sizing: border-box; padding: 36px 40px; display: flex; flex-direction: column;">

  <div style="font-weight: 800; font-size: 22px; color: #0F1729; letter-spacing: -0.02em;">Paleta</div>
  <div style="font-weight: 600; font-size: 14px; color: #66707F; margin-top: 4px;">Color de marca</div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 26px;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 74px; border-radius: 14px; background: #2563EB;"></div>
      <div style="font-weight: 700; font-size: 13px; color: #0F1729;">Azul primario</div>
      <div style="font-weight: 600; font-size: 12px; color: #66707F;">#2563EB</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 74px; border-radius: 14px; background: #1D4ED8;"></div>
      <div style="font-weight: 700; font-size: 13px; color: #0F1729;">Azul oscuro</div>
      <div style="font-weight: 600; font-size: 12px; color: #66707F;">#1D4ED8</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 74px; border-radius: 14px; background: #A3E635;"></div>
      <div style="font-weight: 700; font-size: 13px; color: #0F1729;">Acento lima</div>
      <div style="font-weight: 600; font-size: 12px; color: #66707F;">#A3E635</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 74px; border-radius: 14px; background: #0F1729;"></div>
      <div style="font-weight: 700; font-size: 13px; color: #0F1729;">Tinta</div>
      <div style="font-weight: 600; font-size: 12px; color: #66707F;">#0F1729</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 74px; border-radius: 14px; background: #66707F;"></div>
      <div style="font-weight: 700; font-size: 13px; color: #0F1729;">Gris</div>
      <div style="font-weight: 600; font-size: 12px; color: #66707F;">#66707F</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 74px; border-radius: 14px; background: #F5F6FA; border: 1px solid #E3E6EE;"></div>
      <div style="font-weight: 700; font-size: 13px; color: #0F1729;">Fondo</div>
      <div style="font-weight: 600; font-size: 12px; color: #66707F;">#F5F6FA</div>
    </div>

  </div>
</div>

</x-dc>
</body>
</html>
