<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 560px; height: 480px; background: #F5F6FA; box-sizing: border-box; padding: 36px 40px; display: flex; flex-direction: column; gap: 30px;">

  <div style="font-weight: 800; font-size: 22px; color: #0F1729; letter-spacing: -0.02em;">Lockups</div>

  <!-- Horizontal -->
  <div style="display: flex; align-items: center; gap: 16px;">
    <div style="position: relative; width: 60px; height: 60px; border-radius: 15px; background: #2563EB; display: flex; align-items: center; justify-content: center;">
      <svg width="43" height="43" viewBox="0 0 120 120" style="position: absolute;">
        <circle cx="60" cy="60" r="46" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-dasharray="214 75" transform="rotate(40 60 60)"></circle>
      </svg>
      <span style="position: relative; font-weight: 800; font-size: 21px; color: #FFFFFF; line-height: 1;">F</span>
    </div>
    <div style="font-weight: 800; font-size: 34px; letter-spacing: -0.03em; line-height: 1;"><span style="color: #0F1729;">Cuota</span><span style="color: #2563EB;">fit</span></div>
  </div>

  <div style="height: 1px; background: #E3E6EE;"></div>

  <!-- Vertical + Isotipo -->
  <div style="display: flex; align-items: center; gap: 56px;">
    <!-- Vertical -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="position: relative; width: 72px; height: 72px; border-radius: 18px; background: #2563EB; display: flex; align-items: center; justify-content: center;">
        <svg width="52" height="52" viewBox="0 0 120 120" style="position: absolute;">
          <circle cx="60" cy="60" r="46" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-dasharray="214 75" transform="rotate(40 60 60)"></circle>
        </svg>
        <span style="position: relative; font-weight: 800; font-size: 25px; color: #FFFFFF; line-height: 1;">F</span>
      </div>
      <div style="font-weight: 800; font-size: 26px; letter-spacing: -0.03em; line-height: 1;"><span style="color: #0F1729;">Cuota</span><span style="color: #2563EB;">fit</span></div>
    </div>

    <!-- Isotipo solo -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div style="position: relative; width: 72px; height: 72px; border-radius: 18px; background: #2563EB; display: flex; align-items: center; justify-content: center;">
        <svg width="52" height="52" viewBox="0 0 120 120" style="position: absolute;">
          <circle cx="60" cy="60" r="46" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-dasharray="214 75" transform="rotate(40 60 60)"></circle>
        </svg>
        <span style="position: relative; font-weight: 800; font-size: 25px; color: #FFFFFF; line-height: 1;">F</span>
      </div>
      <div style="font-weight: 600; font-size: 12px; color: #66707F;">Isotipo solo</div>
    </div>
  </div>

  <div style="height: 1px; background: #E3E6EE;"></div>

  <!-- Wordmark solo -->
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-weight: 800; font-size: 40px; letter-spacing: -0.03em; line-height: 1;"><span style="color: #0F1729;">Cuota</span><span style="color: #2563EB;">fit</span></div>
    <div style="font-weight: 600; font-size: 12px; color: #66707F;">Wordmark</div>
  </div>

</div>

</x-dc>
</body>
</html>
