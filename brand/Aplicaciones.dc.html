<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 1120px; height: 480px; background: #F5F6FA; box-sizing: border-box; padding: 36px 40px; display: flex; flex-direction: column; gap: 26px;">

  <div>
    <div style="font-weight: 800; font-size: 22px; color: #0F1729; letter-spacing: -0.02em;">Aplicaciones</div>
    <div style="font-weight: 600; font-size: 14px; color: #66707F; margin-top: 4px;">Favicon / app-icon y versión monocromática</div>
  </div>

  <!-- Favicon sizes -->
  <div style="display: flex; align-items: flex-end; gap: 40px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div style="position: relative; width: 64px; height: 64px; border-radius: 16px; background: #2563EB; display: flex; align-items: center; justify-content: center;">
        <svg width="46" height="46" viewBox="0 0 120 120" style="position: absolute;">
          <circle cx="60" cy="60" r="46" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-dasharray="214 75" transform="rotate(40 60 60)"></circle>
        </svg>
        <span style="position: relative; font-weight: 800; font-size: 22px; color: #FFFFFF; line-height: 1;">F</span>
      </div>
      <div style="font-weight: 600; font-size: 12px; color: #66707F;">64px</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div style="position: relative; width: 32px; height: 32px; border-radius: 9px; background: #2563EB; display: flex; align-items: center; justify-content: center;">
        <svg width="23" height="23" viewBox="0 0 120 120" style="position: absolute;">
          <circle cx="60" cy="60" r="46" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-dasharray="214 75" transform="rotate(40 60 60)"></circle>
        </svg>
        <span style="position: relative; font-weight: 800; font-size: 11px; color: #FFFFFF; line-height: 1;">F</span>
      </div>
      <div style="font-weight: 600; font-size: 12px; color: #66707F;">32px</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div style="position: relative; width: 16px; height: 16px; border-radius: 5px; background: #2563EB; display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 120 120" style="position: absolute;">
          <circle cx="60" cy="60" r="46" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-dasharray="214 75" transform="rotate(40 60 60)"></circle>
        </svg>
        <span style="position: relative; font-weight: 800; font-size: 6px; color: #FFFFFF; line-height: 1;">F</span>
      </div>
      <div style="font-weight: 600; font-size: 12px; color: #66707F;">16px</div>
    </div>
  </div>

  <div style="height: 1px; background: #E3E6EE;"></div>

  <!-- Monochrome -->
  <div style="display: flex; gap: 24px;">
    <!-- On light (black version) -->
    <div style="flex: 1; background: #FFFFFF; border: 1px solid #E3E6EE; border-radius: 16px; padding: 24px; display: flex; align-items: center; gap: 18px;">
      <div style="position: relative; width: 60px; height: 60px; border-radius: 15px; background: #0F1729; display: flex; align-items: center; justify-content: center;">
        <svg width="43" height="43" viewBox="0 0 120 120" style="position: absolute;">
          <circle cx="60" cy="60" r="46" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-dasharray="214 75" transform="rotate(40 60 60)"></circle>
        </svg>
        <span style="position: relative; font-weight: 800; font-size: 20px; color: #FFFFFF; line-height: 1;">F</span>
      </div>
      <div style="font-weight: 800; font-size: 30px; letter-spacing: -0.03em; color: #0F1729; line-height: 1;">Cuotafit</div>
    </div>
    <!-- On dark (white version) -->
    <div style="flex: 1; background: #0F1729; border-radius: 16px; padding: 24px; display: flex; align-items: center; gap: 18px;">
      <div style="position: relative; width: 60px; height: 60px; border-radius: 15px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="43" height="43" viewBox="0 0 120 120" style="position: absolute;">
          <circle cx="60" cy="60" r="46" fill="none" stroke="#0F1729" stroke-width="13" stroke-linecap="round" stroke-dasharray="214 75" transform="rotate(40 60 60)"></circle>
        </svg>
        <span style="position: relative; font-weight: 800; font-size: 20px; color: #0F1729; line-height: 1;">F</span>
      </div>
      <div style="font-weight: 800; font-size: 30px; letter-spacing: -0.03em; color: #FFFFFF; line-height: 1;">Cuotafit</div>
    </div>
  </div>

</div>

</x-dc>
</body>
</html>
